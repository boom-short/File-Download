<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Web Source Code & Preview Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 900px; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; font-size: 24px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input[type="text"] { flex: 1; padding: 12px 15px; border: 1px solid #475569; background: #0f172a; color: #fff; border-radius: 6px; font-size: 16px; outline: none; transition: 0.3s; }
        input[type="text"]:focus { border-color: #38bdf8; }
        button { padding: 12px 20px; background: #0284c7; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #0ea5e9; }
        
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; margin-bottom: 10px; }
        .tabs { display: flex; gap: 10px; }
        .tab-btn { background: #334155; color: #cbd5e1; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .tab-btn.active { background: #0284c7; color: #fff; }
        
        .download-btn { background: #10b981; display: none; }
        .download-btn:hover { background: #059669; }

        .view-section { display: none; margin-top: 10px; }
        .view-section.active { display: block; }

        pre { background: #0f172a; padding: 15px; border-radius: 6px; overflow-x: auto; max-height: 450px; color: #34d399; font-size: 13px; border: 1px solid #334155; white-space: pre-wrap; word-wrap: break-word; }
        iframe { width: 100%; height: 450px; background: #fff; border-radius: 6px; border: 1px solid #334155; }
        
        .loading { color: #facc15; text-align: center; margin: 15px 0; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>অ্যাডভান্সড সোর্স কোড ও প্রিভিউ ভিউয়ার</h2>
    <div class="input-group">
        <input type="text" id="urlInput" placeholder="এখানে ওয়েবসাইটের লিংক দিন (যেমন: https://example.com)">
        <button onclick="fetchSourceCode()">ফেচ করুন</button>
    </div>

    <div id="loading" class="loading">প্রটেকশন বাইপাস করে কোড আনা হচ্ছে, দয়া করে অপেক্ষা করুন...</div>

    <div class="header-actions">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('source')">সোর্স কোড (Source Code)</button>
            <button class="tab-btn" onclick="switchTab('preview')">লাইভ প্রিভিউ (Live Preview)</button>
        </div>
        <!-- ডাউনলোড বাটন -->
        <button id="downloadBtn" class="download-btn" onclick="downloadSourceCode()">কোড ডাউনলোড করুন</button>
    </div>

    <!-- সোর্স কোড ভিউ -->
    <div id="sourceView" class="view-section active">
        <pre id="output">এখানে কোড শো করবে...</pre>
    </div>

    <!-- লাইভ প্রিভিউ ভিউ -->
    <div id="previewView" class="view-section">
        <iframe id="previewFrame"></iframe>
    </div>
</div>

<script>
    let fetchedHtmlContent = "";

    async function fetchSourceCode() {
        const url = document.getElementById('urlInput').value.trim();
        const output = document.getElementById('output');
        const previewFrame = document.getElementById('previewFrame');
        const loading = document.getElementById('loading');
        const downloadBtn = document.getElementById('downloadBtn');

        if (!url) {
            alert("দয়া করে একটি সঠিক ইউআরএল (URL) দিন!");
            return;
        }

        output.textContent = "";
        downloadBtn.style.display = "none";
        loading.style.display = "block";

        const apiEndpoint = `/scrape?url=${encodeURIComponent(url)}`;

        try {
            const response = await fetch(apiEndpoint);
            const data = await response.json();

            loading.style.display = "none";

            if (data.status === "success") {
                fetchedHtmlContent = data.html;
                
                // সোর্স কোড দেখানো
                output.textContent = fetchedHtmlContent;
                
                // ডাউনলোড বাটন ভিজিবল করা
                downloadBtn.style.display = "block";

                // প্রিভিউ ফ্রেম রেন্ডার করা
                const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
                doc.open();
                doc.write(fetchedHtmlContent);
                doc.close();
            } else {
                output.textContent = "ত্রুটি: " + (data.error || "কোড লোড করা যায়নি!");
            }
        } catch (error) {
            loading.style.display = "none";
            output.textContent = "নেটওয়ার্ক ত্রুটি ঘটেছে: " + error.message;
        }
    }

    function downloadSourceCode() {
        if (!fetchedHtmlContent) {
            alert("ডাউনলোড করার মতো কোনো কোড নেই!");
            return;
        }

        const blob = new Blob([fetchedHtmlContent], { type: 'text/html;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'downloaded_source.html';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.view-section').forEach(section => section.classList.remove('active'));

        if (tabName === 'source') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('sourceView').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('previewView').classList.add('active');
        }
    }
</script>

</body>
</html>
